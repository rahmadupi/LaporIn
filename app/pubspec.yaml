name: laporin
description: "LaporIn — Laporkan, Perbaiki, Bersama."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6

  # State Management
  flutter_riverpod: ^2.4.9

  # Routing
  go_router: ^14.0.0

  # Officer proof-upload (M3): camera, GPS, HTTP, offline storage,
  # voice notes, permission requests.
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true
